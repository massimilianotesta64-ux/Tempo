<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="description" content="Free, ad-free music player with synced lyrics and your own playlists.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Tempo</title>
<style>
:root{
  --bg:#0b0d10;--panel:#15181d;--panel2:#1e2229;--line:#2a2f37;
  --text:#f3f5f8;--muted:#9aa3ae;--accent:#ff6b4a;--accent2:#ffb347;
  --tabs-h:58px;--mini-h:64px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{width:24px;height:24px;fill:currentColor;display:block}
.hidden{display:none!important}
#app{max-width:760px;margin:0 auto;padding:calc(var(--sat) + 8px) 16px calc(var(--tabs-h) + var(--sab) + 24px)}
body.has-mini #app{padding-bottom:calc(var(--tabs-h) + var(--mini-h) + var(--sab) + 28px)}
.top{display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{flex:1;margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.icon-btn:active{background:var(--panel2)}
.icon-btn.on{color:var(--accent)}
h2{font-size:19px;margin:22px 0 10px;font-weight:750;letter-spacing:-.01em}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head h2{margin-bottom:10px}
.link{color:var(--muted);font-size:13px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:#1a0d08}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.card{flex:none;width:138px;text-align:left}
.card .art{width:138px;height:138px;border-radius:10px}
.card .ct{font-weight:650;font-size:14px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1,#3a3f4a),var(--c2,#20242b));display:grid;place-items:center;flex:none}
.art::before{content:"♪";font-size:22px;color:rgba(255,255,255,.55)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art img.broken{visibility:hidden}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;min-width:0}
.row .art{width:50px;height:50px;border-radius:6px}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.on{color:var(--accent)}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{width:22px;text-align:center;color:var(--muted);font-size:13px;flex:none}
.row .more{color:var(--muted)}
.row:active{opacity:.7}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--panel2);font-weight:650;font-size:14px}
.btn.primary{background:var(--accent);color:#1a0d08}
.btn svg{width:20px;height:20px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.round-play{width:54px;height:54px;border-radius:50%;background:var(--accent);color:#1a0d08;display:grid;place-items:center}
.round-play svg{width:28px;height:28px}
.lib-tile{display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.lib-tile .art{width:56px;height:56px;border-radius:8px}
.lib-tile .t{font-weight:650}
.liked-art{--c1:#ff6b4a;--c2:#7a2bff}
.liked-art::before{content:"♥";font-size:26px;color:#fff}
.files-art{--c1:#1fb6a6;--c2:#14415c}
.files-art::before{content:"⤓";font-size:26px;color:#fff}
.hero{display:flex;gap:16px;align-items:flex-end;margin:6px 0 4px}
.hero .art{width:132px;height:132px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.hero .ht{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
.search-box{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:10px;padding:0 12px;margin:4px 0 6px}
.search-box input{flex:1;background:none;border:0;outline:0;padding:12px 0;font-size:16px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=password],.sheet input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.card-box{background:var(--panel);border-radius:14px;padding:14px 16px;margin:10px 0}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs-h) + var(--sab));padding-bottom:var(--sab);background:rgba(11,13,16,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:center;border-top:1px solid #16191e;z-index:20}
.tabs button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--text)}
.tabs button b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.lang-btn{font-size:22px;line-height:1}
.lang-opt .fl{font-size:24px;width:28px;text-align:center}
.lang-opt.on{color:var(--accent)}
/* Mini player */
.mini{position:fixed;left:8px;right:8px;bottom:calc(var(--tabs-h) + var(--sab) + 6px);max-width:744px;margin:0 auto;height:var(--mini-h);background:var(--panel2);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 8px;z-index:21;box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;cursor:pointer}
.mini .art{width:46px;height:46px;border-radius:6px}
.mini .meta{flex:1;min-width:0}
.mini .t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .s.lyric{color:var(--accent2)}
.mini .bar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:rgba(255,255,255,.15);border-radius:2px}
.mini .bar i{display:block;height:100%;width:0;background:var(--text);border-radius:2px}
/* Full player */
.player{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,var(--pc,#3a2a2a) 0%,var(--bg) 62%);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(var(--sat) + 6px) 20px calc(var(--sab) + 14px);visibility:hidden}
.player.open{transform:none;visibility:visible}
.player .ph{display:flex;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto}
.player .ph .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.seg{display:flex;background:rgba(0,0,0,.28);border-radius:999px;padding:3px;margin:8px auto 0;max-width:300px;width:100%}
.seg button{flex:1;padding:6px 0;border-radius:999px;font-size:13px;font-weight:650;color:rgba(255,255,255,.75)}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:560px;width:100%;margin:12px auto}
.pbody .bigart{width:min(100%,46vh,420px);aspect-ratio:1;border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.pbody .bigart::before{font-size:64px}
.lyrics{width:100%;height:100%;overflow-y:auto;padding:30% 4px 40%;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 80%,transparent)}
.lyrics::-webkit-scrollbar{display:none}
.lyrics p{margin:0;padding:7px 0;font-size:24px;font-weight:800;line-height:1.25;color:rgba(255,255,255,.38);transition:color .25s,transform .25s;cursor:pointer;letter-spacing:-.01em}
.lyrics p.on{color:#fff}
.lyrics p.past{color:rgba(255,255,255,.6)}
.lyrics.plain p{font-size:18px;font-weight:650;color:rgba(255,255,255,.85);cursor:default;padding:3px 0}
.lyrics .note{font-size:13px;color:rgba(255,255,255,.55);padding-top:18px;font-weight:500}
.lyr-empty{text-align:center;color:rgba(255,255,255,.75)}
.lyr-empty .btn{margin-top:14px}
.queue{width:100%;height:100%;overflow-y:auto}
.queue h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6);margin:6px 0}
.pinfo{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto}
.pinfo .meta{flex:1;min-width:0}
.pinfo .t{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.pinfo .s{color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek{max-width:560px;width:100%;margin:12px auto 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.22)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.65)}
.controls{display:flex;align-items:center;justify-content:space-between;max-width:420px;width:100%;margin:6px auto 0}
.controls .big{width:66px;height:66px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.controls .big svg{width:34px;height:34px}
.controls .icon-btn svg{width:30px;height:30px}
.controls .side svg{width:24px;height:24px}
.controls .icon-btn{position:relative}
.controls .icon-btn.on::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.st-art::before{content:none!important}.st-art svg{width:28px;height:28px;color:#fff}
.art.logo img{object-fit:contain;background:#fff;padding:8%}
.bigart.logo img{padding:16%}
.livebar{display:none;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;color:#fff;padding:4px 0 10px}
.livebar i{width:8px;height:8px;border-radius:50%;background:#ff3b3b;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.player.is-radio .seek input,.player.is-radio .times{display:none}
.player.is-radio .livebar{display:flex}
.player.is-radio #pShuffle,.player.is-radio #pRepeat{opacity:.25;pointer-events:none}
.rep1{position:absolute;font-size:9px;font-weight:800;top:9px;right:7px;color:var(--accent)}
.credit{text-align:center;font-size:11px;color:rgba(255,255,255,.45);margin-top:8px}
.credit a{color:inherit}
/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:18px 18px 0 0;padding:10px 16px calc(var(--sab) + 14px);max-height:80vh;overflow-y:auto;animation:up .2s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet .sh{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sheet .sh .art{width:48px;height:48px;border-radius:6px}
.sheet .sh .t{font-weight:700}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:13px 2px;font-size:15px;font-weight:550}
.sheet .opt.danger{color:#ff6b6b}
.sheet .opt:active{opacity:.6}
.sheet h3{margin:6px 0 12px;font-size:17px}
.sheet .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + var(--mini-h) + var(--sab) + 20px);transform:translateX(-50%) translateY(20px);background:#f3f5f8;color:#111;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.player.open ~ #toast{bottom:auto;top:calc(var(--sat) + 96px)}
@media (min-width:700px){.card{width:160px}.card .art{width:160px;height:160px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back"></button>
    <h1 id="viewTitle">Home</h1>
    <button id="langBtn" class="icon-btn lang-btn" aria-label="Language"></button>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings"></button>
  </header>
  <main id="view"></main>
</div>

<div id="mini" class="mini hidden" role="button" aria-label="Open player">
  <div class="art" id="miniArt"></div>
  <div class="meta"><div class="t" id="miniTitle"></div><div class="s" id="miniSub"></div></div>
  <button class="icon-btn" id="miniLike" aria-label="Like"></button>
  <button class="icon-btn" id="miniPlay" aria-label="Play or pause"></button>
  <div class="bar"><i id="miniBar"></i></div>
</div>

<nav class="tabs">
  <button data-tab="home" class="on"><span data-ico="home"></span><b data-t="tab_home">Home</b></button>
  <button data-tab="search"><span data-ico="search"></span><b data-t="tab_search">Search</b></button>
  <button data-tab="radio"><span data-ico="radio"></span><b data-t="tab_radio">Radio</b></button>
  <button data-tab="library"><span data-ico="library"></span><b data-t="tab_library">Your Library</b></button>
</nav>

<section id="player" class="player" aria-label="Now playing">
  <div class="ph">
    <button class="icon-btn" id="pClose" aria-label="Close player"></button>
    <div class="lbl" id="pFrom">Now playing</div>
    <button class="icon-btn" id="pMore" aria-label="More"></button>
  </div>
  <div class="seg" id="pSeg">
    <button data-pane="song" data-t="seg_song">Song</button>
    <button data-pane="lyrics" data-t="seg_lyrics">Lyrics</button>
    <button data-pane="queue" data-t="seg_queue">Queue</button>
  </div>
  <div class="pbody" id="pBody"></div>
  <div class="pinfo">
    <div class="meta"><div class="t" id="pTitle"></div><div class="s" id="pArtist"></div></div>
    <button class="icon-btn hidden" id="pAirplay" aria-label="AirPlay"></button>
    <button class="icon-btn" id="pLike" aria-label="Like"></button>
  </div>
  <div class="seek">
    <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek">
    <div class="times"><span id="pCur">0:00</span><span id="pDur">0:00</span></div>
    <div class="livebar"><i></i><span data-t="live_radio">LIVE RADIO</span></div>
  </div>
  <div class="controls">
    <button class="icon-btn side" id="pShuffle" aria-label="Shuffle"></button>
    <button class="icon-btn" id="pPrev" aria-label="Previous"></button>
    <button class="big" id="pPlay" aria-label="Play or pause"></button>
    <button class="icon-btn" id="pNext" aria-label="Next"></button>
    <button class="icon-btn side" id="pRepeat" aria-label="Repeat"></button>
  </div>
  <div class="credit" id="pCredit"></div>
</section>

<div id="sheet" class="sheet-wrap hidden"><div class="sheet" id="sheetBody"></div></div>
<div id="toast"></div>
<audio id="audio" preload="auto" playsinline x-webkit-airplay="allow"></audio>
<input type="file" id="fileInput" accept="audio/*,.mp3,.flac,.m4a,.aac,.wav,.ogg,.opus" multiple hidden>
<input type="file" id="backupInput" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============================================================
   Tempo: free, ad-free music player
   Sources: Audius (free legal streaming) + the user's own files
   Lyrics: LRCLIB
   ============================================================ */
const APP_NAME = 'TempoPWA';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const sleep = ms => new Promise(r => setTimeout(r, ms));

const store = {
  get(k, d) { try { const v = localStorage.getItem('tempo.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tempo.' + k, JSON.stringify(v)); } catch {} }
};

/* ---------------- Icons ---------------- */
const ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.1v13.8a1 1 0 0 0 1.5.86l11-6.9a1 1 0 0 0 0-1.72l-11-6.9A1 1 0 0 0 8 5.1z"/></svg>',
  airplay: '<svg viewBox="0 0 24 24"><path d="M6 22h12l-6-6zM21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4v-2H3V5h18v12h-4v2h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M5 6.2v11.6a.8.8 0 0 0 1.2.7l9-5.8a.8.8 0 0 0 0-1.4l-9-5.8a.8.8 0 0 0-1.2.7zM17 5h2v14h-2z"/></svg>',
  prev: '<svg viewBox="0 0 24 24"><path d="M19 6.2v11.6a.8.8 0 0 1-1.2.7l-9-5.8a.8.8 0 0 1 0-1.4l9-5.8a.8.8 0 0 1 1.2.7zM5 5h2v14H5z"/></svg>',
  shuffle: '<svg viewBox="0 0 24 24"><path d="M14.5 4H20v5.5l-2-2-12.6 12.6L4 18.7 16.6 6.1zM4 5.4 5.4 4l5 5-1.4 1.4zm14 11.2 2-2V20h-5.5l2-2-3.3-3.3 1.4-1.4z"/></svg>',

const idb = (() => {

    const r = indexedDB.open('tempo', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('files', { keyPath: 'key' }); r.result.createObjectStore('meta', { keyPath: 'localKey' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  };
  return {
    put: (s, v) => tx(s, 'readwrite', o => o.put(v)),
    get: (s, k) => tx(s, 'readonly', o => o.get(k)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k)),

const Audius = {
  base: null,
  async candidates() {
    const list = ['https://api.audius.co/v1'];
    try {
      const r = await fetch('https://api.audius.co', { cache: 'no-store' });
      const j = await r.json();
      if (Array.isArray(j.data)) for (const h of j.data.slice(0, 4)) list.push(String(h).replace(/\/$/, '') + '/v1');
    } catch {}

  },
  async get(path, params = {}) {
    const qs = new URLSearchParams({ ...params, app_name: APP_NAME }).toString();
    const opts = S.settings.apiKey ? { headers: { 'x-api-key': S.settings.apiKey } } : {};
    const hit = async b => {
      const r = await fetch(`${b}${path}?${qs}`, opts);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return (await r.json()).data;
    };
    if (this.base) { try { return await hit(this.base); } catch { this.base = null; } }
    let last;
    for (const b of await this.candidates()) {
      try { const d = await hit(b); this.base = b; return d; } catch (e) { last = e; }
    }
    throw last || new Error('Audius unavailable');
  },
  streamUrl(id) { return `${this.base || 'https://api.audius.co/v1'}/tracks/${encodeURIComponent(id)}/stream?app_name=${APP_NAME}`; },
  track(t) {

  tracks(arr) { return (arr || []).map(x => this.track(x)).filter(Boolean); },

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  async get(path, params = {}) {

    const list = this.base ? [this.base, ...this.servers.filter(s => s !== this.base)] : this.servers.slice().sort(() => Math.random() - 0.5);
    let last;

        clearTimeout(tm);

async function drawRadioList() {

  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.playlists) || !Array.isArray(d.liked)) throw 0;
    const have = new Set(S.playlists.map(p => p.id));
    for (const p of d.playlists) if (!have.has(p.id)) S.playlists.push(p);
    const lk = new Set(S.liked.map(t => t.id));
    for (const t of d.liked) if (!lk.has(t.id)) S.liked.push(t);
    if (Array.isArray(d.stations)) { const st = new Set(S.stations.map(t => t.id)); for (const t of d.stations) if (!st.has(t.id)) S.stations.push(t); save.stations(); }

    <button class="opt" data-a="q">${ICON.addq}${esc(T('add_all_queue'))}</button>

    <button class="opt danger" data-a="d">${ICON.trash}${esc(T('delete_playlist'))}</button>`);
  $('[data-a=q]', b).onclick = () => { closeSheet(); p.tracks.forEach(t => S.queue.push(t)); if (S.qi < 0 && S.queue.length) { S.qi = 0; loadTrack(true); } toast(T('added_queue')); };
  $('[data-a=r]', b).onclick = async () => { const n = await ask(T('rename_playlist'), p.name); if (n) { p.name = n; save.playlists(); refresh(); } };
  $('[data-a=d]', b).onclick = async () => {
    const b2 = openSheet(`<h3>${esc(T('delete_q', { x: p.name }))}</h3><p class="muted small">${esc(T('cant_undo'))}</p><div class="actions"><button class="btn" id="dNo">${esc(T('cancel'))}</button><button class="btn primary" id="dOk">${esc(T('delete'))}</button></div>`);
    $('#dNo', b2).onclick = closeSheet;
    $('#dOk', b2).onclick = () => { S.playlists = S.playlists.filter(x => x.id !== p.id); save.playlists(); closeSheet(); back(); toast(T('playlist_deleted')); };
  };
}
async function editLocal(t) {
  const title = await ask(T('song_title'), t.title); if (!title) return;
  const artist = await ask(T('artist'), t.artist); if (!artist) return;
  const m = await idb.get('meta', t.localKey); if (!m) return;
  m.title = title; m.artist = artist; await idb.put('meta', m);
  const upd = x => { if (x.id === t.id) { x.title = title; x.artist = artist; } };
  S.local.forEach(upd); S.queue.forEach(upd); S.liked.forEach(upd); S.history.forEach(upd); S.playlists.forEach(p => p.tracks.forEach(upd));
  save.liked(); save.history(); save.playlists(); lyricCache.delete(t.id);
  refresh(); if (cur() && cur().id === t.id) { updateNowPlaying(); loadLyrics(); }
}
async function deleteLocal(t) {
  await idb.del('files', t.localKey); await idb.del('meta', t.localKey);
  S.local = S.local.filter(x => x.id !== t.id); localArt.delete(t.localKey);
  toast(T('file_deleted')); refresh();
}

/* Click delegation for track rows */
$('#view').addEventListener('click', e => {
  const list = e.target.closest('[data-list]'); if (!list) return;
  const L = LISTS.get(list.dataset.list); if (!L) return;
  const more = e.target.closest('[data-more]');
  if (more) { e.stopPropagation(); const i = +more.dataset.more; return trackMenu(L.tracks[i], L.ctx, i); }
  const row = e.target.closest('.row'); if (!row) return;
  playList(L.tracks, +row.dataset.i, L.ctx.from || '', null);
});

/* ---------------- Player engine ---------------- */
const audio = $('#audio');
let localURL = null, errorRun = 0, pendingSeek = null, loadedId = null;

function shuffleArr(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function playList(tracks, start = 0, from = '', shuffle = null) {
  if (!tracks.length) return;
  if (shuffle !== null) { S.shuffle = shuffle; store.set('shuffle', S.shuffle); }
  const list = tracks.slice();
  S.original = list.slice();
  if (S.shuffle && !isRadio(list[start])) { const first = list.splice(start, 1)[0]; S.queue = [first, ...shuffleArr(list)]; S.qi = 0; }
  else { S.queue = list; S.qi = start; }
  S.from = from;
  loadTrack(true);
}
function playNext(t) { if (S.qi < 0) return playList([t], 0, ''); S.queue.splice(S.qi + 1, 0, t); toast(T('playing_next')); drawQueueIfOpen(); }
function addToQueue(t) { if (S.qi < 0) return playList([t], 0, ''); S.queue.push(t); toast(T('added_queue')); drawQueueIfOpen(); }

async function loadTrack(autoplay, at = 0) {
  const t = cur(); if (!t) return;
  if (localURL) { URL.revokeObjectURL(localURL); localURL = null; }
  try {
    if (isRadio(t)) {
      audio.src = t.streamUrl;
      Radio.click(t.uuid);
    } else if (t.src === 'local') {
      const rec = await idb.get('files', t.localKey);
      if (!rec) { toast(T('not_on_device', { x: t.title })); return skipAfterError(); }
      localURL = URL.createObjectURL(rec.blob);
      audio.src = localURL;
    } else {
      if (!Audius.base) { try { await Audius.get('/tracks/trending', { time: 'week' }); } catch {} }
      audio.src = Audius.streamUrl(t.audiusId);
    }
  } catch { return skipAfterError(); }
  loadedId = t.id;
  pendingSeek = at > 0 ? at : null;
  updateNowPlaying();
  if (!isRadio(t)) addHistory(t);
  loadLyrics();
  if (autoplay) audio.play().catch(err => { if (err && err.name !== 'AbortError') console.warn(err); });
  saveSession();
}
function skipAfterError() {
  errorRun++;
  if (errorRun > 4) { errorRun = 0; toast(T('several_failed')); return; }
  setTimeout(() => next(true), 700);
}
function addHistory(t) { S.history = [slim(t), ...S.history.filter(x => x.id !== t.id)].slice(0, 40); save.history(); }
function togglePlay() {
  if (!cur()) return;
  if (!audio.src || loadedId !== cur().id) return loadTrack(true, pendingSeek || 0);
  if (audio.paused) { if (isRadio(cur())) return loadTrack(true); audio.play().catch(() => {}); } else audio.pause();
}
async function next(auto = false) {
  if (!S.queue.length) return;
  if (auto && isRadio(cur())) { if (++errorRun <= 2) { setTimeout(() => loadTrack(true), 1200); } else { errorRun = 0; toast(T('stopped_broadcasting')); updatePlayState(); } return; }
  if (auto && S.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }
  if (S.qi + 1 < S.queue.length) { S.qi++; return loadTrack(true); }
  if (S.repeat === 'all') { S.qi = 0; return loadTrack(true); }
  if (auto && S.settings.autoplay && await extendQueue()) { S.qi++; return loadTrack(true); }
  if (!auto) { S.qi = 0; loadTrack(false); } else { audio.pause(); audio.currentTime = 0; updatePlayState(); }
}
function prev() {
  if (isRadio(cur())) { if (S.qi > 0) { S.qi--; loadTrack(true); } return; }
  if (audio.currentTime > 3 || S.qi <= 0) { audio.currentTime = 0; return; }
  S.qi--; loadTrack(true);
}
async function extendQueue() {
  const t = cur(); if (!t) return false;
  const seen = new Set(S.queue.map(x => x.id));
  let more = [];
  try {
    if (t.src === 'local') more = shuffleArr(S.local.filter(x => !seen.has(x.id)));
    if (!more.length) {
      const params = { time: 'week' }; if (t.genre) params.genre = t.genre;
      more = shuffleArr(Audius.tracks(await Audius.get('/tracks/trending', params)).filter(x => !seen.has(x.id)));
    }
  } catch { return false; }
  more = more.slice(0, 15);
  if (!more.length) return false;
  S.queue.push(...more); S.from = T('more_like_this');
  toast(T('keeping_going'));
  return true;
}
function setShuffle(on) {
  S.shuffle = on; store.set('shuffle', on);
  const c = cur();
  if (on && S.queue.length > 1) { S.original = S.queue.slice(); const rest = S.queue.filter((_, i) => i !== S.qi); S.queue = [c, ...shuffleArr(rest)]; S.qi = 0; }
  else if (!on && S.original) { const i = S.original.findIndex(x => c && x.id === c.id); if (i >= 0) { S.queue = S.original.slice(); S.qi = i; } }
  updateModes(); drawQueueIfOpen();
  toast(on ? T('shuffle_on') : T('shuffle_off'));
}
function cycleRepeat() {
  S.repeat = { off: 'all', all: 'one', one: 'off' }[S.repeat]; store.set('repeat', S.repeat);
  updateModes(); toast(T({ off: 'repeat_off', all: 'repeat_all', one: 'repeat_one' }[S.repeat]));
}

audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null) { try { audio.currentTime = pendingSeek; } catch {} pendingSeek = null; }
  const t = cur(); if (t && !t.duration && isFinite(audio.duration)) t.duration = audio.duration;
  updateTime();
});
audio.addEventListener('playing', () => { errorRun = 0; updatePlayState(); });
audio.addEventListener('play', updatePlayState);
audio.addEventListener('pause', () => { updatePlayState(); saveSession(); });
audio.addEventListener('ended', () => next(true));
audio.addEventListener('error', () => { if (!audio.src || !cur()) return; if (isRadio(cur())) { toast(T('station_unavailable')); updatePlayState(); return; } toast(T('couldnt_play', { x: cur().title })); skipAfterError(); });
let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  updateTime(); syncLyrics();
  if (Date.now() - lastSave > 5000) { lastSave = Date.now(); saveSession(); }
});

/* Session restore (queue survives closing the app) */
function saveSession() { store.set('session', { queue: S.queue.slice(0, 300).map(slim), qi: S.qi, time: audio.currentTime || 0, from: S.from }); }
window.addEventListener('pagehide', saveSession);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveSession(); });
function restoreSession() {
  const s = store.get('session', null);
  if (!s || !Array.isArray(s.queue) || !s.queue[s.qi]) return;
  S.queue = s.queue; S.qi = s.qi; S.from = s.from || '';
  pendingSeek = isRadio(S.queue[S.qi]) ? 0 : (s.time || 0);
  updateNowPlaying(); loadLyrics();
  $('#pCur').textContent = fmt(pendingSeek);
}

/* Lock screen / headphone controls */
function setMediaSession(t) {
  if (!('mediaSession' in navigator)) return;
  const art = trackArt(t);
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: t.album || S.from || 'Tempo', artwork: art ? [{ src: art, sizes: '480x480', type: art.startsWith('data:') ? 'image/jpeg' : 'image/jpeg' }] : [{ src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' }] });
  } catch {}
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession, h = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  h('play', () => { if (audio.paused && isRadio(cur())) loadTrack(true); else audio.play(); }); h('pause', () => audio.pause());
  h('previoustrack', prev); h('nexttrack', () => next());
  h('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
  h('seekbackward', d => { audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset || 10)); });
  h('seekforward', d => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + (d.seekOffset || 10)); });
}

/* ---------------- Player UI ---------------- */
const player = $('#player');
function openPlayer() { if (!cur()) return; player.classList.add('open'); drawPane(); }
function closePlayer() { player.classList.remove('open'); }
$('#mini').onclick = e => { if (e.target.closest('button')) return; openPlayer(); };
$('#miniPlay').onclick = togglePlay;
$('#miniLike').onclick = () => toggleLike(cur());
$('#pLike').onclick = () => toggleLike(cur());
// AirPlay (iPhone / iPad / Mac Safari): open the speaker list from inside Tempo
(() => {
  const btn = $('#pAirplay');
  if (typeof audio.webkitShowPlaybackTargetPicker !== 'function') return;
  btn.innerHTML = ICON.airplay;
  btn.classList.remove('hidden');
  btn.onclick = () => { try { audio.webkitShowPlaybackTargetPicker(); } catch {} };
  audio.addEventListener('webkitcurrentplaybacktargetiswirelesschanged', () => btn.classList.toggle('on', !!audio.webkitCurrentPlaybackTargetIsWireless));
})();
$('#pClose').onclick = closePlayer;
$('#pPlay').onclick = togglePlay;
$('#pNext').onclick = () => next();
$('#pPrev').onclick = prev;
$('#pShuffle').onclick = () => setShuffle(!S.shuffle);
$('#pRepeat').onclick = cycleRepeat;
$('#pMore').onclick = () => cur() && trackMenu(cur());
$$('#pSeg button').forEach(b => b.onclick = () => { S.settings.pane = b.dataset.pane; save.settings(); drawPane(); });
// Swipe down on the header to close
(() => { let y0 = null; const ph = $('.ph', player);
  ph.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  ph.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 60) closePlayer(); y0 = null; });
})();
const seek = $('#pSeek'); let seeking = false;
seek.addEventListener('input', () => { seeking = true; const d = audio.duration || (cur() && cur().duration) || 0; $('#pCur').textContent = fmt(seek.value / 1000 * d); seek.style.setProperty('--p', seek.value / 10 + '%'); });
seek.addEventListener('change', () => { const d = audio.duration || 0; if (d) audio.currentTime = seek.value / 1000 * d; else pendingSeek = seek.value / 1000 * ((cur() && cur().duration) || 0); seeking = false; });
document.addEventListener('keydown', e => { if (e.code === 'Space' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); togglePlay(); } });

function updateNowPlaying() {
  const t = cur();
  document.body.classList.toggle('has-mini', !!t);
  $('#mini').classList.toggle('hidden', !t);
  if (!t) return;
  $('#miniArt').outerHTML = artHTML(t).replace('class="art ', 'id="miniArt" class="art ');
  $('#miniTitle').textContent = t.title;
  $('#miniSub').textContent = isRadio(t) ? '● ' + T('live') + ' · ' + t.artist : showArtist(t.artist); $('#miniSub').classList.remove('lyric');
  player.classList.toggle('is-radio', isRadio(t));
  $('#pTitle').textContent = t.title; $('#pArtist').textContent = showArtist(t.artist);
  $('#pFrom').textContent = S.from ? T('playing_from', { x: S.from }) : T('now_playing');
  $('#pCredit').innerHTML = isRadio(t) ? `${esc(T('live_radio_lbl'))}${t.homepage && /^https?:\/\//i.test(t.homepage) ? ` · <a href="${esc(t.homepage)}" target="_blank" rel="noopener">${esc(T('station_website'))}</a>` : ''}` : t.src === 'audius' ? `${esc(T('streaming_audius'))}${t.link ? ` · <a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(T('support', { x: t.artist }))}</a>` : ''}` : esc(T('from_files'));
  const h = hue(t.title + t.artist); player.style.setProperty('--pc', `hsl(${h} 35% 26%)`);
  $('#pDur').textContent = fmt(t.duration);
  setMediaSession(t); updateLikeButtons(); updatePlayState(); updateModes(); markPlaying();
  if (player.classList.contains('open')) drawPane();
  document.title = `${t.title} · ${t.artist}`;
}
function updateLikeButtons() { const l = isLiked(cur()); [$('#miniLike'), $('#pLike')].forEach(b => { b.innerHTML = l ? ICON.heart : ICON.heartO; b.classList.toggle('on', l); }); }
function updatePlayState() { const p = !audio.paused; $('#miniPlay').innerHTML = p ? ICON.pause : ICON.play; $('#pPlay').innerHTML = p ? ICON.pause : ICON.play; if ('mediaSession' in navigator) try { navigator.mediaSession.playbackState = p ? 'playing' : 'paused'; } catch {} }
function updateModes() { $('#pShuffle').classList.toggle('on', S.shuffle); $('#pRepeat').classList.toggle('on', S.repeat !== 'off'); $('#rep1').classList.toggle('hidden', S.repeat !== 'one'); }
let lastPos = 0;
function updateTime() {
  const d = audio.duration || (cur() && cur().duration) || 0, c = audio.currentTime || 0;
  const pct = d ? Math.min(100, c / d * 100) : 0;
  $('#miniBar').style.width = pct + '%';
  if (!seeking) { seek.value = pct * 10; seek.style.setProperty('--p', pct + '%'); $('#pCur').textContent = fmt(c); }
  if (isFinite(audio.duration)) $('#pDur').textContent = fmt(audio.duration);
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && isFinite(audio.duration) && Date.now() - lastPos > 4000) {
    lastPos = Date.now(); try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: Math.min(c, audio.duration), playbackRate: 1 }); } catch {}
  }
}

/* Panes: song art / lyrics / queue */
let LYR = null, lyrIdx = -1, lyrFor = null, userScrollAt = 0;
function drawPane() {
  const pane = S.settings.pane || 'song', B = $('#pBody'), t = cur();
  $$('#pSeg button').forEach(b => b.classList.toggle('on', b.dataset.pane === pane));
  if (!t) { B.innerHTML = ''; return; }
  if (pane === 'song') { B.innerHTML = artHTML(t, 'bigart'); return; }
  if (pane === 'queue') return drawQueue();
  drawLyrics();
}
function drawQueueIfOpen() { if (player.classList.contains('open') && S.settings.pane === 'queue') drawQueue(); }
function drawQueue() {
  const B = $('#pBody'), up = S.queue.slice(S.qi + 1, S.qi + 101);
  B.innerHTML = `<div class="queue"><h3>${esc(T('now_playing'))}</h3><div id="qNow"></div><h3 style="margin-top:16px">${esc(T('next_up'))}${up.length ? ` · ${S.queue.length - S.qi - 1}` : ''}</h3><div id="qNext"></div></div>`;
  const now = cur();
  $('#qNow').innerHTML = `<div class="row">${artHTML(now)}<div class="meta"><div class="t on">${esc(now.title)}</div><div class="s">${esc(now.artist)}</div></div></div>`;
  $('#qNext').innerHTML = up.length ? up.map((t, i) => `<div class="row" data-q="${S.qi + 1 + i}">${artHTML(t)}<div class="meta"><div class="t">${esc(t.title)}</div><div class="s">${esc(t.artist)}</div></div><button class="icon-btn more" data-qx="${S.qi + 1 + i}" aria-label="Remove from queue">✕</button></div>`).join('') : `<div class="muted small">${esc(S.settings.autoplay ? T('similar_will_play') : T('queue_empty'))}</div>`;
  $$('[data-q]', B).forEach(r => r.onclick = e => {
    const x = e.target.closest('[data-qx]');
    if (x) { S.queue.splice(+x.dataset.qx, 1); return drawQueue(); }
    S.qi = +r.dataset.q; loadTrack(true);
  });
}
async function loadLyrics(override) {
  const t = cur(); if (!t) return;
  lyrFor = t.id; lyrIdx = -1;
  if (isRadio(t)) { LYR = 'radio'; if (S.settings.pane === 'lyrics' && player.classList.contains('open')) drawLyrics(); return; }
  LYR = 'loading';
  if (S.settings.pane === 'lyrics' && player.classList.contains('open')) drawLyrics();
  const res = await fetchLyrics(t, override);
  if (lyrFor !== t.id) return;
  LYR = res || 'none';
  if (S.settings.pane === 'lyrics' && player.classList.contains('open')) drawLyrics();
}
function drawLyrics() {
  const B = $('#pBody'), t = cur();
  lyrIdx = -1;
  if (LYR === 'radio') { B.innerHTML = `<div class="lyr-empty"><b>${esc(T('live_radio_lbl'))}</b><br><span class="small">${esc(T('lyr_radio_sub'))}</span></div>`; return; }
  if (LYR === 'loading' || LYR == null) { B.innerHTML = '<div class="spinner"></div>'; return; }
  if (LYR === 'none' || (!LYR.synced && !LYR.plain)) {
    B.innerHTML = `<div class="lyr-empty">${LYR && LYR.instrumental ? `<b>${esc(T('instrumental'))}</b><br><span class="small">${esc(T('no_lyrics_in'))}</span>` : `<b>${esc(T('no_lyrics'))}</b><br><span class="small">${T('no_lyrics_sub')}</span>`}<br><button class="btn" id="lyrSearch">${ICON.search}${esc(T('search_lyrics'))}</button></div>`;
    $('#lyrSearch').onclick = () => manualLyrics(t);
    return;
  }
  if (LYR.synced) {
    B.innerHTML = `<div class="lyrics" id="lyr">${LYR.synced.map((l, i) => `<p data-i="${i}">${esc(l.text) || '♪'}</p>`).join('')}<div class="note">${esc(T('lyrics_from'))}</div></div>`;
    const box = $('#lyr');
    box.addEventListener('touchmove', () => userScrollAt = Date.now(), { passive: true });
    box.addEventListener('wheel', () => userScrollAt = Date.now(), { passive: true });
    $$('p', box).forEach(p => p.onclick = () => { const l = LYR.synced[+p.dataset.i]; if (audio.src) audio.currentTime = l.t; else pendingSeek = l.t; userScrollAt = 0; syncLyrics(true); });
    syncLyrics(true);
  } else {
    B.innerHTML = `<div class="lyrics plain">${LYR.plain.split(/\r?\n/).map(l => `<p>${esc(l) || '&nbsp;'}</p>`).join('')}<div class="note">${esc(T('lyrics_plain'))}</div></div>`;
  }
}
async function manualLyrics(t) {
  const title = await ask(T('song_title_search'), cleanTitle(t.title), T('next')); if (!title) return;
  const artist = await ask(T('artist'), /^unknown artist$/i.test(t.artist) ? '' : t.artist, T('search'));
  if (artist === null) return;
  lyricCache.delete(t.id);
  await loadLyrics({ title, artist });
  if (LYR !== 'none') lyricCache.set(t.id, LYR);
}
function syncLyrics(force) {
  if (!LYR || !LYR.synced) return;
  const time = (audio.src ? audio.currentTime : pendingSeek || 0) + 0.3;
  const L = LYR.synced;
  let i = -1; for (let k = 0; k < L.length; k++) { if (L[k].t <= time) i = k; else break; }
  if (i === lyrIdx && !force) return;
  lyrIdx = i;
  // Mini player shows the current line
  const sub = $('#miniSub'), line = i >= 0 ? L[i].text : '';
  if (line) { sub.textContent = line; sub.classList.add('lyric'); } else if (cur()) { sub.textContent = showArtist(cur().artist); sub.classList.remove('lyric'); }
  const box = $('#lyr'); if (!box || !player.classList.contains('open')) return;
  $$('p', box).forEach((p, k) => { p.classList.toggle('on', k === i); p.classList.toggle('past', k < i); });
  if (i >= 0 && Date.now() - userScrollAt > 3500) {
    const p = box.children[i];
    if (p) box.scrollTo({ top: p.offsetTop - box.clientHeight * 0.38, behavior: force ? 'auto' : 'smooth' });
  }
}

/* ---------------- Start ---------------- */
(async function init() {
  if (!S.settings.lang) { S.settings.lang = detectLang(); save.settings(); }
  applyStatic();
  render();
  await loadLocal();
  restoreSession();
  if (route.name === 'library') refresh();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
